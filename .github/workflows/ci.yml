name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

# Cancel superseded runs for the same branch, but never cancel a run that is
# already verifying the production branch. Deployment runs are serialized by
# the separate Deploy workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint client and server
        run: npm run lint

      - name: Run server tests
        run: npm test

      - name: Build client
        run: npm run build
